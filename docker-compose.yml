services:
  # BACKEND API
  autify-api:
    build:
      context: ./backend
      args:
        - CACHE_BUST=3.1.0
    pull_policy: build
    environment:
      - MONGODB_URL=mongodb://autify-db:27017
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TZ=Europe/Rome
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LEGACY_ADMIN_PWD=${LEGACY_ADMIN_PWD}
      - LEGACY_VIEWER_PWD=${LEGACY_VIEWER_PWD}
      - LICENSE_SERVER_URL=http://autify-license-server:8001
      - LICENSE_SHARED_SECRET=${LICENSE_SHARED_SECRET}
      - LICENSE_CACHE_HOURS=${LICENSE_CACHE_HOURS:-24}
      - LICENSE_OFFLINE_GRACE_HOURS=${LICENSE_OFFLINE_GRACE_HOURS:-72}
    depends_on:
      autify-db:
        condition: service_started
      autify-license-server:
        condition: service_healthy
    restart: unless-stopped

  # FRONTEND ADMIN (porta 8090)
  autify-admin:
    build:
      context: ./frontend_admin
      args:
        - CACHE_BUST=3.1.0
    pull_policy: build
    ports:
      - "8090:80"
    depends_on:
      - autify-api
    restart: unless-stopped

  # DATABASE
  autify-db:
    image: mongo:8.0.4
    restart: unless-stopped
    volumes:
      - autify_data:/data/db

  # SERVER LICENZE. In produzione può essere distribuito su un host HTTPS dedicato.
  autify-license-server:
    build:
      context: ./license_server
    environment:
      - LICENSE_SHARED_SECRET=${LICENSE_SHARED_SECRET}
      - LICENSE_ADMIN_KEY=${LICENSE_ADMIN_KEY}
      - LICENSE_REQUEST_FRESHNESS_SECONDS=${LICENSE_REQUEST_FRESHNESS_SECONDS:-120}
      - LICENSE_ACTIVATE_RATE_LIMIT=${LICENSE_ACTIVATE_RATE_LIMIT:-10/minute}
      - LICENSE_VALIDATE_RATE_LIMIT=${LICENSE_VALIDATE_RATE_LIMIT:-60/minute}
      - LICENSE_DB_PATH=/data/licenses.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - autify_license_data:/data
    restart: unless-stopped

volumes:
  autify_data:
  autify_license_data:
