services:
  # BACKEND API
  autify-api:
    build:
      context: ./backend
      args:
        - CACHE_BUST=3.2.3
    pull_policy: build
    environment:
      - MONGODB_URL=mongodb://autify-db:27017
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TZ=Europe/Rome
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LICENSE_SERVER_URL=${LICENSE_SERVER_URL}
      - LICENSE_SHARED_SECRET=${LICENSE_SHARED_SECRET}
      - LICENSE_CACHE_HOURS=${LICENSE_CACHE_HOURS:-24}
      - LICENSE_OFFLINE_GRACE_HOURS=${LICENSE_OFFLINE_GRACE_HOURS:-72}
      - LICENSE_SERVER_TIMEOUT_SECONDS=${LICENSE_SERVER_TIMEOUT_SECONDS:-8}
    depends_on:
      autify-db:
        condition: service_started
    restart: unless-stopped

  # FRONTEND ADMIN (porta 8090)
  autify-admin:
    build:
      context: ./frontend_admin
      args:
        - CACHE_BUST=3.2.3
    pull_policy: build
    ports:
      - "8090:80"
    depends_on:
      - autify-api
    restart: unless-stopped

  # DATABASE
  autify-db:
    image: mongo:8.0.4
    restart: unless-stopped
    volumes:
      - autify_data:/data/db

volumes:
  autify_data:
